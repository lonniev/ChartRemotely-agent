[project]
name = "chartremotely"
version = "0.2.0"
description = "Remote control of desktop charting applications on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Lonnie VanZandt" }]
keywords = ["thinkorswim", "accessibility", "automation", "charting"]

# The resolver is pure stdlib and testable anywhere. The macOS driver needs
# PyObjC, which is why it is an optional extra rather than a hard dependency:
# CI must be able to run the logic tests on Linux.
dependencies = []

[project.optional-dependencies]
macos = [
  "pyobjc-framework-ApplicationServices>=10",
  "pyobjc-framework-Cocoa>=10",
  "pyobjc-framework-Quartz>=10",
  "pyobjc-framework-Security>=10",
]
# `chartremotely setup` makes and proves Nostr identities. The key and proof
# code is the tollbooth-dpyc SDK's own, never rewritten here.
setup = ["tollbooth-dpyc[nostr]==0.90.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
chartremotely = "chartremotely.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chartremotely*"]

[tool.setuptools.package-data]
chartremotely = ["assets/*.plist"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# vocab.py is the boundary between the drivers and the outside world. Its
# contract is that it NEVER raises - a Shortcut treats an exception as a hard
# failure and aborts before it can read the message. Catching broadly is the
# design, not an oversight.
"chartremotely/vocab.py" = ["BLE001", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
