name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow's stamp job dispatches this on changelog/stamp: a PR its
  # App token opens starts no pull_request run, and `test` is a required check.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check chartremotely tests
      - run: pytest -q
